# ═══════════════════════════════════════════════════════
# e-Vaccin — Configuration Spring Boot
# ═══════════════════════════════════════════════════════

# ── Serveur ──
server.port=8080

# ── MySQL (XAMPP) ──
spring.datasource.url=jdbc:mysql://localhost:3306/evaccin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
app.jwt.secret=eVaccinSenegal2026SecretKeyMinimum32Chars!
app.jwt.expiration=86400000
